name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # The repo has no game files. CI downloads the three copies the page offers from
      # the Internet Archive and keeps them in the cache, keyed on the hashes in jar.mjs.
      - uses: actions/cache@v6
        with:
          path: archive
          key: archive-${{ hashFiles('web/engine/jar.mjs') }}
      - run: npm run fetch-archive
        timeout-minutes: 5
      # The tests that need no game files, and each Archive copy played to the ending.
      # The rest need the pinned builds locally.
      - run: >-
          node --test
          --test-skip-pattern="every input matches its recorded hash|an instrument for every note both games play"
          test/inputs.test.mjs test/soundfont.test.mjs test/archive.test.mjs
      - run: node --test --test-name-pattern="^sh3-2010-v1\.0\.20-a can be played" test/mobile3-route.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
