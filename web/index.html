<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Hill Mobile Port</title>
  <style>
    :root {
      --background: #111;
      --surface: #1c1c1c;
      --text: #e8e6e1;
      --muted: #a3a09a;
      --border: #3a3a3a;
      --accent: #d9c98f;
      --warning: #e0a458;
      --error: #e57373;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    #drop {
      width: min(480px, 100%);
      padding: 32px 24px;
      text-align: center;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 8px;
    }
    #drop.dragging { border-color: var(--accent); }
    h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
    #drop p { margin: 0 0 16px; color: var(--muted); }
    #choose {
      display: inline-block;
      padding: 10px 18px;
      min-height: 44px;
      color: #111;
      background: var(--accent);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    #choose:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
    #file { position: absolute; opacity: 0; width: 1px; height: 1px; }
    #message { margin: 0; max-width: 480px; text-align: center; }
    #message:empty { display: none; }
    #message.warning { color: var(--warning); }
    #message.error { color: var(--error); }
    #game {
      display: none;
      width: min(calc(100vw - 32px), calc(100vh - 96px));
      aspect-ratio: 1;
      background: #000;
      cursor: none;
      touch-action: none;
    }
    #help { display: none; margin: 0; color: var(--muted); font-size: 0.875rem; text-align: center; }
    body.playing #drop { display: none; }
    body.playing #game { display: block; }
    body.playing #help { display: block; }
  </style>
</head>
<body>
  <div id="drop">
    <h1>Silent Hill Mobile</h1>
    <p>Drop your own Silent Hill J2ME JAR here. It's read in this browser and isn't uploaded anywhere.</p>
    <label id="choose">Choose a JAR<input id="file" type="file" accept=".jar"></label>
  </div>
  <p id="message" role="status"></p>
  <canvas id="game" width="768" height="768" aria-label="Game screen"></canvas>
  <p id="help">Click to look around and to continue text. Esc skips the opening.</p>
  <script type="module" src="main.mjs"></script>
</body>
</html>
