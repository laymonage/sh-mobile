<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://archive.org https://*.archive.org; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Hill Mobile Port</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="drop">
    <h1>Silent Hill Mobile</h1>
    <p>Drop your own Silent Hill J2ME JAR here. It's read in this browser and isn't uploaded anywhere.</p>
    <div id="sources">
      <label id="choose">Choose a JAR<input id="file" type="file" accept=".jar"></label>
      <button type="button" data-archive="sh1">Silent Hill from the Internet Archive</button>
      <button type="button" data-archive="sh2">Mobile 2 from the Internet Archive</button>
    </div>
  </div>
  <p id="message" role="status"></p>
  <canvas id="game" width="768" height="768" aria-label="Game screen"></canvas>
  <div id="panel">
    <div id="actions">
      <button type="button" id="soft-left" hidden></button>
      <div id="controls">
        <div class="plate-row in-game" id="item-keys">
          <button type="button" data-key="1" aria-keyshortcuts="1">Gun <kbd>1</kbd></button>
          <button type="button" data-key="3" aria-keyshortcuts="3">First aid <kbd>3</kbd></button>
          <button type="button" data-key="inventory" aria-keyshortcuts="I">Inventory <kbd>I</kbd></button>
        </div>
        <div class="plate-row in-game">
          <button type="button" id="save">Save</button>
          <button type="button" id="load">Load</button>
        </div>
        <div class="plate-row">
          <button type="button" id="sound" aria-pressed="true">Sound: on</button>
          <label id="volume-control">Volume <input id="volume" type="range" min="0" max="100" step="5"></label>
          <div id="soundfont-control">
            <button type="button" id="soundfont" title="Choose a soundfont">Soundfont</button>
            <button type="button" id="soundfont-remove" aria-label="Remove soundfont" title="Remove soundfont" hidden>×</button>
            <a id="soundfont-get" href="https://www.musical-artifacts.com/artifacts/693" target="_blank" rel="noopener noreferrer" aria-label="Get the Series 40 soundfont from Musical Artifacts" title="Get the Series 40 soundfont from Musical Artifacts">Get</a>
          </div>
          <input id="soundfont-file" type="file" accept=".sf2" hidden>
        </div>
      </div>
      <button type="button" id="soft-right" hidden></button>
    </div>
  </div>
  <script type="module" src="main.mjs"></script>
</body>
</html>
