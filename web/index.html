<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Hill Mobile Port</title>
  <style>
    :root {
      --background: #111;
      --surface: #1c1c1c;
      --text: #e8e6e1;
      --muted: #a3a09a;
      --border: #3a3a3a;
      --accent: #d9c98f;
      --warning: #e0a458;
      --error: #e57373;
      --paper: #eae2b2;
      --rust: #9c5a2e;
      --blood: #a3231b;
      --rivet: #8f8270;
      --plate-top: #2e2823;
      --plate-bottom: #14110f;
      --plate-edge: #5f4331;
      --plate-dim: #85796a;
      --plate-height: 27px;
      --plate-gap: 4px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      gap: 12px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    #drop {
      width: min(480px, 100%);
      padding: 32px 24px;
      text-align: center;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 8px;
    }
    #drop.dragging { border-color: var(--accent); }
    h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
    #drop p { margin: 0 0 16px; color: var(--muted); }
    #choose {
      display: inline-block;
      padding: 10px 18px;
      min-height: 44px;
      color: #111;
      background: var(--accent);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    #choose:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
    #file { position: absolute; opacity: 0; width: 1px; height: 1px; }
    #message { margin: 0; max-width: 480px; text-align: center; }
    /* During play, a message floats over the page instead of pushing the game down. */
    body.playing #message { position: fixed; top: 8px; left: 50%; z-index: 1; width: max-content; max-width: calc(100vw - 32px); padding: 4px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; transform: translateX(-50%); }
    #message:empty { display: none; }
    #message.warning { color: var(--warning); }
    #message.error { color: var(--error); }
    #game {
      display: none;
      width: min(calc(100vw - 32px), calc((100vh - 32px) / 1.27));
      aspect-ratio: 1;
      background: #000;
      cursor: none;
      touch-action: none;
    }
    /* The page puts the game's own rusted steel art behind this, once a JAR is loaded.
       Everything in it keeps its place, so that nothing moves as buttons come and go. */
    #panel {
      display: none;
      align-items: center;
      width: min(calc(100vw - 32px), calc((100vh - 32px) / 1.27));
      aspect-ratio: 240 / 64;
      container: panel / inline-size;
      margin-top: -12px;
      padding: 14px 10px 8px;
      background-color: #000;
      background-size: 100% 100%;
      image-rendering: pixelated;
    }
    body.playing #panel { display: flex; }
    #actions {
      display: none;
      flex: 1;
      min-width: 0;
      grid-template-columns: max(17%, 84px) minmax(0, 1fr) max(17%, 84px);
      gap: var(--plate-gap);
    }
    #controls { display: grid; grid-auto-rows: var(--plate-height); gap: var(--plate-gap); min-width: 0; }
    .plate-row { display: flex; gap: var(--plate-gap); min-width: 0; }
    .plate-row > * { flex: 1 1 0; min-width: 0; }
    /* These labels never change, so they can take the space they need. */
    #item-keys > * { flex-basis: auto; }
    #panel #sound { flex: 0 0 74px; }
    #soundfont-control { flex-grow: 1.5; display: flex; gap: 2px; }
    #soundfont { flex: 1; min-width: 0; }
    #soundfont-remove { flex: 0 0 var(--plate-height); padding: 0; }
    #soft-left[hidden], #soft-right[hidden] { display: block; visibility: hidden; }
    #panel #soft-left, #panel #soft-right { padding: 0 3px; }
    /* Bolted steel plates, one rivet in each corner, with text in the notepad's color. */
    #panel button, #volume-control {
      min-height: 0;
      padding: 0 6px;
      color: var(--paper);
      background:
        radial-gradient(circle, var(--rivet) 0 1px, transparent 1.5px) 1px 1px / 5px 5px no-repeat,
        radial-gradient(circle, var(--rivet) 0 1px, transparent 1.5px) calc(100% - 1px) 1px / 5px 5px no-repeat,
        radial-gradient(circle, var(--rivet) 0 1px, transparent 1.5px) 1px calc(100% - 1px) / 5px 5px no-repeat,
        radial-gradient(circle, var(--rivet) 0 1px, transparent 1.5px) calc(100% - 1px) calc(100% - 1px) / 5px 5px no-repeat,
        linear-gradient(var(--plate-top), var(--plate-bottom));
      border: 1px solid var(--plate-edge);
      border-radius: 1px;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.1), inset 0 -1px rgba(0, 0, 0, 0.6), 0 1px 3px #000;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      text-shadow: 0 1px 1px #000;
      image-rendering: auto;
    }
    #panel button { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #panel kbd {
      margin-left: 3px;
      padding: 1px 4px;
      color: var(--paper);
      background: #000;
      border: 1px solid var(--plate-edge);
      border-radius: 2px;
      font: 600 0.6875rem ui-monospace, monospace;
    }
    #panel button:hover:not(:disabled) { color: #fff; border-color: var(--blood); box-shadow: inset 0 1px rgba(255, 255, 255, 0.1), inset 0 0 8px rgba(163, 35, 27, 0.55), 0 1px 3px #000; }
    #panel button:active:not(:disabled) { background-color: #000; box-shadow: inset 0 2px 4px #000; transform: translateY(1px); }
    #panel button:focus-visible, #volume:focus-visible { outline: 2px solid var(--paper); outline-offset: 1px; }
    #panel button:disabled { color: var(--plate-dim); opacity: 1; text-shadow: none; }
    #volume-control { display: flex; align-items: center; gap: 6px; flex-grow: 1.2; }
    #volume { flex: 1; min-width: 0; height: 100%; margin: 0; background: transparent; cursor: pointer; appearance: none; }
    #volume::-webkit-slider-runnable-track { height: 4px; background: #000; border: 1px solid var(--plate-edge); border-radius: 1px; }
    #volume::-moz-range-track { height: 2px; background: #000; border: 1px solid var(--plate-edge); border-radius: 1px; }
    #volume::-webkit-slider-thumb { width: 8px; height: 14px; margin-top: -6px; background: linear-gradient(var(--paper), var(--rust)); border: 1px solid #000; border-radius: 1px; appearance: none; }
    #volume::-moz-range-thumb { width: 6px; height: 12px; background: linear-gradient(var(--paper), var(--rust)); border: 1px solid #000; border-radius: 1px; }
    @media (pointer: coarse) { :root { --plate-height: 36px; } }
    /* Too narrow for tall soft keys at the sides, so they get a row of their own. */
    @container panel (max-width: 420px) {
      #actions { grid-template-columns: 1fr 1fr; grid-template-rows: var(--plate-height) auto; }
      #soft-left { grid-area: 1 / 1; }
      #soft-right { grid-area: 1 / 2; }
      #controls { grid-area: 2 / 1 / 3 / -1; }
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:disabled:hover { border-color: var(--border); }
    button {
      min-height: 44px;
      padding: 8px 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body.playing #drop { display: none; }
    body.playing #game { display: block; }
    body.playing #actions { display: grid; }
    body.in-menu .in-game { visibility: hidden; }
  </style>
</head>
<body>
  <div id="drop">
    <h1>Silent Hill Mobile</h1>
    <p>Drop your own Silent Hill J2ME JAR here. It's read in this browser and isn't uploaded anywhere.</p>
    <label id="choose">Choose a JAR<input id="file" type="file" accept=".jar"></label>
  </div>
  <p id="message" role="status"></p>
  <canvas id="game" width="768" height="768" aria-label="Game screen"></canvas>
  <div id="panel">
    <div id="actions">
      <button type="button" id="soft-left" hidden></button>
      <div id="controls">
        <div class="plate-row in-game" id="item-keys">
          <button type="button" data-key="1" aria-keyshortcuts="1">Gun <kbd>1</kbd></button>
          <button type="button" data-key="3" aria-keyshortcuts="3">First aid <kbd>3</kbd></button>
          <button type="button" data-key="inventory" aria-keyshortcuts="I">Inventory <kbd>I</kbd></button>
        </div>
        <div class="plate-row in-game">
          <button type="button" id="save">Save</button>
          <button type="button" id="load">Load</button>
        </div>
        <div class="plate-row">
          <button type="button" id="sound" aria-pressed="true">Sound: on</button>
          <label id="volume-control">Volume <input id="volume" type="range" min="0" max="100" step="5"></label>
          <div id="soundfont-control">
            <button type="button" id="soundfont" title="Choose a soundfont">Soundfont</button>
            <button type="button" id="soundfont-remove" aria-label="Remove soundfont" title="Remove soundfont" hidden>×</button>
          </div>
          <input id="soundfont-file" type="file" accept=".sf2" hidden>
        </div>
      </div>
      <button type="button" id="soft-right" hidden></button>
    </div>
  </div>
  <script type="module" src="main.mjs"></script>
</body>
</html>
