<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Hill Mobile Port</title>
  <style>
    :root {
      --background: #111;
      --surface: #1c1c1c;
      --text: #e8e6e1;
      --muted: #a3a09a;
      --border: #3a3a3a;
      --accent: #d9c98f;
      --warning: #e0a458;
      --error: #e57373;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    #drop {
      width: min(480px, 100%);
      padding: 32px 24px;
      text-align: center;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 8px;
    }
    #drop.dragging { border-color: var(--accent); }
    h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
    #drop p { margin: 0 0 16px; color: var(--muted); }
    #choose {
      display: inline-block;
      padding: 10px 18px;
      min-height: 44px;
      color: #111;
      background: var(--accent);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    #choose:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
    #file { position: absolute; opacity: 0; width: 1px; height: 1px; }
    #message { margin: 0; max-width: 480px; text-align: center; }
    #message:empty { display: none; }
    #message.warning { color: var(--warning); }
    #message.error { color: var(--error); }
    #game {
      display: none;
      width: min(calc(100vw - 32px), calc(100vh - 176px));
      aspect-ratio: 1;
      background: #000;
      cursor: none;
      touch-action: none;
    }
    #actions { display: none; flex-wrap: wrap; justify-content: center; gap: 8px; }
    #start { display: none; gap: 8px; }
    body.choosing #start { display: flex; }
    body.choosing #actions, body.choosing #help { display: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:disabled:hover { border-color: var(--border); }
    button {
      min-height: 44px;
      padding: 8px 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    #volume-control { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    #volume { width: 96px; accent-color: var(--accent); }
    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #help { display: none; margin: 0; color: var(--muted); font-size: 0.875rem; text-align: center; }
    body.playing #drop { display: none; }
    body.playing #game { display: block; }
    body.playing:not(.choosing) #help { display: block; }
    body.playing:not(.choosing) #actions { display: flex; }
  </style>
</head>
<body>
  <div id="drop">
    <h1>Silent Hill Mobile</h1>
    <p>Drop your own Silent Hill J2ME JAR here. It's read in this browser and isn't uploaded anywhere.</p>
    <label id="choose">Choose a JAR<input id="file" type="file" accept=".jar"></label>
  </div>
  <p id="message" role="status"></p>
  <canvas id="game" width="768" height="768" aria-label="Game screen"></canvas>
  <div id="actions">
    <button type="button" data-key="1">Gun (1)</button>
    <button type="button" data-key="3">First aid (3)</button>
    <button type="button" id="save">Save</button>
    <button type="button" id="load">Load</button>
    <button type="button" id="sound" aria-pressed="true">Sound: on</button>
    <label id="volume-control">Volume <input id="volume" type="range" min="0" max="100" step="5"></label>
    <button type="button" id="soundfont">Choose soundfont</button>
    <button type="button" id="soundfont-remove" hidden>Remove soundfont</button>
    <input id="soundfont-file" type="file" accept=".sf2" hidden>
  </div>
  <div id="start">
    <button type="button" id="continue">Continue</button>
    <button type="button" id="new-game">New game</button>
  </div>
  <p id="help">Click to look around and to continue text. With the gun out, aim at a monster's center and click to shoot. Esc skips the opening.</p>
  <script type="module" src="main.mjs"></script>
</body>
</html>
